# Render blueprint voor de Champ Client Bot.
# Let op: een Discord-bot draait op Render als "Background Worker"
# (betaald plan). Zet de env-variabelen in het Render-dashboard.
services:
  - type: worker
    name: champ-client-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
