# Render blueprint for Champ Client Bot.
# Note: a Discord bot runs on Render as a "Background Worker" (paid plan).
# Set the environment variables in the Render dashboard.
services:
  - type: worker
    name: champ-client-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_KEY
        sync: false
